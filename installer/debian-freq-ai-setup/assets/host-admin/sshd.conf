# The account has a restricted login shell; each key pins one source token.
Match User freq-alerts
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/freq-ai-setup/host-admin/authorized_keys
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    MaxAuthTries 3
Match all
