# Managed Debian FREQ-AI-SETUP agent policy. Bootstrap root policy remains unchanged.
PrintMotd no
X11Forwarding no

Match Group freq-agents
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand /usr/local/sbin/freq-agent-sandbox
    DisableForwarding yes
    PermitTTY yes
